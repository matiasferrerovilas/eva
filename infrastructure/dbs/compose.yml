services:
  mysql:
    image: mysql:latest
    container_name: mysql_db

    env_file:
      - .env

    restart: always

    volumes:
      - mysql_data:/var/lib/mysql

    ports:
      - "3306:3306"

    networks:
      - m-internal-services

volumes:
  mysql_data:

networks:
  m-internal-services:
    external: true
