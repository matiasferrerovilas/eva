services:
  api-identity:
    image: mferrerovilas/api-identity:latest
    container_name: api-identity

    ports:
      - "8092:8082"

    env_file:
      - .env

    restart: unless-stopped

    networks:
      - m-internal-services
  fe-identity:
    image: mferrerovilas/fe-identity:latest
    container_name: fe-identity

    expose:
      - "80"

    restart: unless-stopped

    networks:
      - m-internal-services

networks:
  m-external-services:
    external: true

  m-internal-services:
    external: true
