services:
  rabbitmq:
    image: rabbitmq:management-alpine
    container_name: 'rabbitmq'
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - ./docker-data/rabbitmq/data/:/var/lib/rabbitmq/
      - ./docker-data/rabbitmq/log/:/var/log/rabbitmq
    networks:
      - m-internal-services

networks:
  m-internal-services:
    external: true
