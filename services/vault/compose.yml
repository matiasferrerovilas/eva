services:
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden

    env_file:
      - .env

    restart: unless-stopped

    expose:
      - "80"

    volumes:
      - ./data:/data

    security_opt:
      - no-new-privileges:true

    networks:
      - m-external-services

networks:
  m-external-services:
    external: true
