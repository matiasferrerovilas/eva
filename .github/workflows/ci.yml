name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff
      # Only real errors (syntax errors, undefined names, unused imports/variables).
      - name: Ruff
        run: ruff check --select E9,F scripts tests

  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-22.04 # 3.8 is not available on ubuntu-24.04 runners
    strategy:
      fail-fast: false
      matrix:
        python: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install zsh (to syntax-check the zsh completion)
        run: sudo apt-get update && sudo apt-get install -y zsh
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Smoke test the CLI
        run: |
          python scripts/eva.py --version
          python scripts/eva.py --help
          python scripts/eva.py completion bash | bash -n
          python scripts/eva.py completion zsh | zsh -n

  # Creates the git tag and the GitHub release when scripts/eva.py bumps VERSION.
  # Does nothing when the tag already exists, so ordinary commits stay green.
  release:
    name: Release
    needs: [lint, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Read the version
        id: version
        run: |
          version=$(sed -n 's/^VERSION = "\(.*\)"/\1/p' scripts/eva.py)
          [ -n "$version" ] || { echo "VERSION not found in scripts/eva.py" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Check whether the tag already exists
        id: tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if git rev-parse -q --verify "refs/tags/v$VERSION" > /dev/null; then
            echo "Tag v$VERSION already exists, nothing to release."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Extract the release notes from CHANGELOG.md
        if: steps.tag.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "CHANGELOG.md has no entry for $VERSION. Add a '## [$VERSION]' section before releasing." >&2
            exit 1
          fi
      - name: Create the tag and the GitHub release
        if: steps.tag.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release create "v$VERSION" --target "$GITHUB_SHA" --title "eva $VERSION" --notes-file notes.md
